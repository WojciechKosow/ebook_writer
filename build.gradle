plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ebookwriter'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	jjwtVersion = '0.11.5'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'

	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// Official Anthropic SDK — the Claude API client for the ebook pipeline.
	implementation 'com.anthropic:anthropic-java:2.34.0'

	// Ebook rendering: Markdown -> HTML (commonmark), HTML normalisation
	// (jsoup), HTML -> PDF (openhtmltopdf).
	implementation 'org.commonmark:commonmark:0.24.0'
	implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
	implementation 'org.jsoup:jsoup:1.18.1'
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

	// Payments.
	implementation 'com.stripe:stripe-java:33.1.1'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}
