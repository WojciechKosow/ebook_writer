# Test config: in-memory H2 (PostgreSQL compatibility mode) so the Spring
# context boots without a real database.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-test-secret-test-secret-32bytes
jwt.expiration=900000

postmark.api.server-token=
app.mail.from=no-reply@localhost
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
