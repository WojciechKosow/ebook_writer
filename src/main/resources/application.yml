# Committed, secret-free configuration. Every value is a ${ENV:default}
# placeholder — real values come from environment variables (Railway, etc.).
# Keep local secret overrides in a gitignored application.properties, which
# Spring loads on top of this file.

spring:
  application:
    name: SaaS

  # Database (PostgreSQL). Override with env vars in production; the defaults
  # target a local postgres.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebookwriter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      # PDF blobs and long manuscripts can be large.
      max-file-size: 25MB
      max-request-size: 25MB

server:
  # Bind to the platform-provided port (Railway/Render set PORT); 8080 locally.
  port: ${PORT:8080}
  # Behind a TLS-terminating proxy: honour X-Forwarded-* so the app sees the
  # real https scheme and client IP (needed for Secure cookies and IP logging).
  forward-headers-strategy: framework

# JWT. jwt.secret MUST be at least 32 chars (256 bits) for HS256 — set a strong,
# random JWT_SECRET in the environment; the default is for local dev only.
jwt:
  secret: ${JWT_SECRET:change-me-local-dev-secret-please-override-32b}
  expiration: ${JWT_EXPIRATION:900000}                       # access token, ms (15 min)
  remember-me-expiration: ${JWT_EXPIRATION_REMEMBER_ME:2592000000}  # with "remember me", ms (30 days)

# Email (Postmark transactional API). Sent over the reactive WebClient
# (Reactor Netty) rather than SMTP — PaaS containers block outbound SMTP ports.
postmark:
  api:
    server-token: ${POSTMARK_SERVER_TOKEN:}
  timeout:
    connect: ${POSTMARK_CONNECT_TIMEOUT_MS:5000}
    read: ${POSTMARK_READ_TIMEOUT_MS:10000}

app:
  mail:
    # Must be a verified Sender Signature / domain in Postmark or sends fail.
    from: ${MAIL_FROM:no-reply@localhost}
    app-name: ${MAIL_APP_NAME:Scrivetta}
  # Base URL of the frontend — used to build verification / reset links.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    # Comma-separated exact origins (no trailing slash).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    # Refresh-cookie attributes. Default None+Secure so the cookie works
    # cross-site (frontend and backend on different domains). Use Lax/Strict
    # only if the frontend and backend share a site.
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:None}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}

# "Continue with Google" — OAuth 2.0 / OpenID Connect sign-in (scopes: openid
# email profile; authentication only). Create an OAuth client of type "Web
# application" in Google Cloud Console. The client secret stays on the backend.
# GOOGLE_REDIRECT_URI is this backend's public callback and must be registered
# verbatim under "Authorized redirect URIs". Leave blank locally to disable.
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}

# Anthropic (Claude) — ebook generation. Model must be a Claude 4.6+ model
# (adaptive thinking is used).
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5}
  timeout-minutes: ${ANTHROPIC_TIMEOUT_MINUTES:15}
  max-retries: ${ANTHROPIC_MAX_RETRIES:2}
  # Step 3 editorial pass — roughly doubles cost (a second pass per chapter).
  # Turn off, or point at a cheaper model, for cheap validation runs.
  editing-enabled: ${ANTHROPIC_EDITING_ENABLED:true}
  editing-model: ${ANTHROPIC_EDITING_MODEL:}

# Cloudflare R2 (S3-compatible) object storage — ebook images (author uploads
# now; AI-generated covers/illustrations later). The bucket is PRIVATE: the app
# uploads with these keys and streams the bytes back into the PDF at render
# time, and serves previews through the authenticated API. Leave the R2_* vars
# blank for local dev — the app boots, and only image upload/render fails with a
# clear message until they are set. The endpoint defaults to
# https://<account-id>.r2.cloudflarestorage.com.
r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  endpoint: ${R2_ENDPOINT:}
  # Create the bucket at startup if missing. Needs an R2 token allowed to create
  # buckets (Admin Read & Write); with an object-only token, leave this false and
  # create the bucket in the Cloudflare dashboard.
  auto-create-bucket: ${R2_AUTO_CREATE_BUCKET:false}

# OpenAI — AI-generated ebook images (and knowledge ingestion, see below). After
# the manuscript is written and edited, the Image Planner decides where images add value and the Image
# Generation service creates them via the OpenAI Image API, storing the bytes in
# the same private R2 bucket as uploaded assets. Leave OPENAI_API_KEY blank for
# local dev — the app boots and books are simply produced text-only until a key
# is set (mirrors the Anthropic/R2 placeholders). Requires R2 to be configured
# too, since generated images are stored there.
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  # Image model. Must return base64 image data (the default does).
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:120000}
  max-retries: ${OPENAI_MAX_RETRIES:2}
  # Master switch for the whole AI image pipeline (planner + generator).
  enabled: ${OPENAI_IMAGES_ENABLED:true}
  # Cost/quality guards — the planner is told to be selective, and these cap it
  # regardless of what the model returns.
  max-images-per-book: ${OPENAI_MAX_IMAGES_PER_BOOK:6}
  max-images-per-chapter: ${OPENAI_MAX_IMAGES_PER_CHAPTER:2}
  # Quality for the cover visual (gpt-image: low|medium|high|auto; blank = provider
  # default). The cover is the most visible asset, so it defaults to high.
  cover-quality: ${OPENAI_COVER_QUALITY:high}
  # ---- Knowledge ingestion ("Tell Scrivetta what you know") -----------------
  # OpenAI is the cheap KNOWLEDGE PROCESSING layer: it reads the author's
  # materials (ZIP / PDF / DOCX / TXT / MD / notes) and stores structured
  # BookKnowledge. Claude is NOT used here — it only writes the book later.
  # The single place to choose the model:
  knowledge-model: ${OPENAI_KNOWLEDGE_MODEL:gpt-5-mini}
  # minimal|low|medium|high for reasoning models; blank for models without
  # reasoning (e.g. gpt-4.1-mini), which reject the parameter.
  knowledge-reasoning-effort: ${OPENAI_KNOWLEDGE_REASONING_EFFORT:low}
  knowledge-max-output-tokens: ${OPENAI_KNOWLEDGE_MAX_OUTPUT_TOKENS:16000}
  knowledge-read-timeout-ms: ${OPENAI_KNOWLEDGE_READ_TIMEOUT_MS:240000}
  knowledge-enabled: ${OPENAI_KNOWLEDGE_ENABLED:true}
  # Prices of the knowledge model (USD per 1M tokens) — only used to estimate and
  # record the cost of each run. Update together with the model.
  knowledge-input-usd-per-million: ${OPENAI_KNOWLEDGE_INPUT_USD_PER_MILLION:0.25}
  knowledge-output-usd-per-million: ${OPENAI_KNOWLEDGE_OUTPUT_USD_PER_MILLION:2.00}
  # ---- Book Blueprint (planning the book from BookKnowledge) ----------------
  # Blank = same model as knowledge-model (one switch for both). The same
  # per-token prices above are used for cost estimates.
  blueprint-model: ${OPENAI_BLUEPRINT_MODEL:}
  blueprint-reasoning-effort: ${OPENAI_BLUEPRINT_REASONING_EFFORT:medium}
  blueprint-max-output-tokens: ${OPENAI_BLUEPRINT_MAX_OUTPUT_TOKENS:24000}

# Knowledge ingestion limits — bound server work and OpenAI cost per book. A huge
# ZIP is read only up to these limits; whatever does not fit one analysis run is
# recorded as "not analysed" (never silently sent).
knowledge:
  max-upload-bytes: ${KNOWLEDGE_MAX_UPLOAD_BYTES:26214400}          # 25 MB (≤ multipart limit)
  max-sources-per-book: ${KNOWLEDGE_MAX_SOURCES_PER_BOOK:20}
  max-notes-chars: ${KNOWLEDGE_MAX_NOTES_CHARS:100000}
  zip-max-entries: ${KNOWLEDGE_ZIP_MAX_ENTRIES:5000}
  zip-max-total-uncompressed-bytes: ${KNOWLEDGE_ZIP_MAX_TOTAL_UNCOMPRESSED_BYTES:209715200}  # 200 MB
  zip-max-compression-ratio: ${KNOWLEDGE_ZIP_MAX_COMPRESSION_RATIO:100}
  extraction-timeout-ms: ${KNOWLEDGE_EXTRACTION_TIMEOUT_MS:60000}
  max-file-bytes: ${KNOWLEDGE_MAX_FILE_BYTES:5242880}               # 5 MB per file inside a ZIP
  max-pdf-pages: ${KNOWLEDGE_MAX_PDF_PAGES:500}
  max-document-chars: ${KNOWLEDGE_MAX_DOCUMENT_CHARS:100000}
  max-stored-chars-per-book: ${KNOWLEDGE_MAX_STORED_CHARS_PER_BOOK:3000000}
  # Per run: ~4 chars/token → 60k chars ≈ 15k tokens per request, 600k ≈ 150k tokens per run.
  max-chars-per-chunk: ${KNOWLEDGE_MAX_CHARS_PER_CHUNK:60000}
  max-analysis-chars: ${KNOWLEDGE_MAX_ANALYSIS_CHARS:600000}
  max-chunks: ${KNOWLEDGE_MAX_CHUNKS:15}
  max-processing-runs: ${KNOWLEDGE_MAX_PROCESSING_RUNS:10}
  notes-context-chars: ${KNOWLEDGE_NOTES_CONTEXT_CHARS:4000}
  stale-processing-minutes: ${KNOWLEDGE_STALE_PROCESSING_MINUTES:30}

# Book Blueprint limits — "a few details", never a form; bounded (re)build cost.
blueprint:
  max-questions: ${BLUEPRINT_MAX_QUESTIONS:8}
  max-chapters: ${BLUEPRINT_MAX_CHAPTERS:30}
  max-generations: ${BLUEPRINT_MAX_GENERATIONS:10}
  max-knowledge-chars: ${BLUEPRINT_MAX_KNOWLEDGE_CHARS:120000}
  stale-building-minutes: ${BLUEPRINT_STALE_BUILDING_MINUTES:30}
  max-answer-chars: ${BLUEPRINT_MAX_ANSWER_CHARS:5000}

# Payments (Stripe) + credits. The $ amounts live in Stripe; credit grants here.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  subscription-price-id: ${STRIPE_SUBSCRIPTION_PRICE_ID:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success?order={ORDER_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/billing}
  portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/billing}
  currency: ${STRIPE_CURRENCY:usd}

credits:
  # Credits granted per successful monthly subscription payment
  # (1 credit = 1 final generated page).
  subscription-monthly-grant: ${CREDITS_SUBSCRIPTION_MONTHLY_GRANT:150}
  # Optional one-time grant when a wallet is first created (useful for testing).
  signup-bonus: ${CREDITS_SIGNUP_BONUS:0}
  # The single central overdraft limit for generation. Because the AI can't
  # guarantee an exact page count, the requested length is only a target; the
  # balance may dip up to this many credits below zero (lowest balance = -10),
  # and never further. It bounds both the up-front hold and the render page cap.
  max-overdraft: ${CREDITS_MAX_OVERDRAFT:10}
  # Minimum credit budget required to START a standard generation. Credits are
  # the generation budget, NOT a promise of an exact page count — this is simply
  # the smallest budget Scrivetta needs to produce a complete standard ebook.
  min-generation-budget: ${CREDITS_MIN_GENERATION_BUDGET:30}
  # Orientational page range for a standard ebook. standard-target-pages is also
  # the DEFAULT target length when the user selects none. A target is a soft
  # content budget (it shapes planning); it is NOT a cap — the only hard limit is
  # the user's credit budget below.
  standard-target-min-pages: ${CREDITS_STANDARD_TARGET_MIN_PAGES:20}
  standard-target-pages: ${CREDITS_STANDARD_TARGET_PAGES:30}
  # Absolute per-generation page ceiling (safety bound only). The real per-book
  # ceiling is min(balance, this) + max-overdraft, so a user with enough credits
  # gets the whole book and it only winds down near their actual budget. Raise it
  # if you want to allow even longer books; it just bounds a single runaway.
  max-generation-budget: ${CREDITS_MAX_GENERATION_BUDGET:250}
  # Largest selectable target length (pages). The target is a SOFT content budget
  # that shapes planning; it never truncates a book. Higher requests are clamped.
  max-target-pages: ${CREDITS_MAX_TARGET_PAGES:150}
