# Committed, secret-free configuration. Every value is a ${ENV:default}
# placeholder — real values come from environment variables (Railway, etc.).
# Keep local secret overrides in a gitignored application.properties, which
# Spring loads on top of this file.

spring:
  application:
    name: SaaS

  # Database (PostgreSQL). Override with env vars in production; the defaults
  # target a local postgres.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebookwriter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      # PDF blobs and long manuscripts can be large.
      max-file-size: 25MB
      max-request-size: 25MB

server:
  # Bind to the platform-provided port (Railway/Render set PORT); 8080 locally.
  port: ${PORT:8080}
  # Behind a TLS-terminating proxy: honour X-Forwarded-* so the app sees the
  # real https scheme and client IP (needed for Secure cookies and IP logging).
  forward-headers-strategy: framework

# JWT. jwt.secret MUST be at least 32 chars (256 bits) for HS256 — set a strong,
# random JWT_SECRET in the environment; the default is for local dev only.
jwt:
  secret: ${JWT_SECRET:change-me-local-dev-secret-please-override-32b}
  expiration: ${JWT_EXPIRATION:900000}                       # access token, ms (15 min)
  remember-me-expiration: ${JWT_EXPIRATION_REMEMBER_ME:2592000000}  # with "remember me", ms (30 days)

# Email (Postmark transactional API).
postmark:
  api:
    server-token: ${POSTMARK_SERVER_TOKEN:}

app:
  mail:
    # Must be a verified Sender Signature / domain in Postmark or sends fail.
    from: ${MAIL_FROM:no-reply@localhost}
    app-name: ${MAIL_APP_NAME:eBook Writer}
  # Base URL of the frontend — used to build verification / reset links.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    # Comma-separated exact origins (no trailing slash).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Anthropic (Claude) — ebook generation. Model must be a Claude 4.6+ model
# (adaptive thinking is used).
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5}
  timeout-minutes: ${ANTHROPIC_TIMEOUT_MINUTES:15}
  max-retries: ${ANTHROPIC_MAX_RETRIES:2}
  # Step 3 editorial pass — roughly doubles cost (a second pass per chapter).
  # Turn off, or point at a cheaper model, for cheap validation runs.
  editing-enabled: ${ANTHROPIC_EDITING_ENABLED:true}
  editing-model: ${ANTHROPIC_EDITING_MODEL:}

# Payments (Stripe) + credits. The $ amounts live in Stripe; credit grants here.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  subscription-price-id: ${STRIPE_SUBSCRIPTION_PRICE_ID:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success?order={ORDER_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/billing}
  currency: ${STRIPE_CURRENCY:usd}

credits:
  # Credits granted per successful monthly subscription payment (1 credit ≈ 1 page).
  subscription-monthly-grant: ${CREDITS_SUBSCRIPTION_MONTHLY_GRANT:150}
  # Optional one-time grant when a wallet is first created (useful for testing).
  signup-bonus: ${CREDITS_SIGNUP_BONUS:0}
