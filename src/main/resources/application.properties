spring.application.name=SaaS

# ---------------------------------------------------------------------------
# Database (PostgreSQL)
# Override with env vars in production; defaults target a local postgres.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebookwriter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# JWT
# jwt.secret MUST be at least 32 chars (256 bits) for HS256. Set a strong,
# random JWT_SECRET in the environment — the default below is for local dev
# only and must not be used in production.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-me-local-dev-secret-please-override-32b}
# Access-token lifetime in ms (default 15 minutes).
jwt.expiration=${JWT_EXPIRATION:900000}
# Access-token lifetime when "remember me" is set, in ms (default 30 days).
jwt.expiration.rememberMe=${JWT_EXPIRATION_REMEMBER_ME:2592000000}

# ---------------------------------------------------------------------------
# Email (Postmark transactional API)
# ---------------------------------------------------------------------------
postmark.api.server-token=${POSTMARK_SERVER_TOKEN:}
# Must be a verified Sender Signature / domain in Postmark or every send fails.
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.mail.app-name=${MAIL_APP_NAME:eBook Writer}

# Base URL of the frontend — used to build the verification / reset links in
# emails (e.g. https://app.example.com/verify?tokenId=...&token=...).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# CORS — comma-separated exact origins (no trailing slash).
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------------------------------------------------------------------
# Anthropic (Claude) — ebook generation.
# Set ANTHROPIC_API_KEY in the environment. Model must be a Claude 4.6+ model
# (adaptive thinking is used). Generation calls can be long, hence the timeout.
# ---------------------------------------------------------------------------
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5}
anthropic.timeout-minutes=${ANTHROPIC_TIMEOUT_MINUTES:15}
anthropic.max-retries=${ANTHROPIC_MAX_RETRIES:2}

# Step 3 editorial pass. It roughly doubles the cost of a book (a second full
# pass over every chapter). Turn it off for cheap validation runs, or point it
# at a cheaper model (e.g. claude-sonnet-5) to keep the consistency pass at a
# fraction of the cost. Blank editing-model = same as anthropic.model.
anthropic.editing-enabled=${ANTHROPIC_EDITING_ENABLED:true}
anthropic.editing-model=${ANTHROPIC_EDITING_MODEL:}

# PDF blobs and long manuscripts can be large; allow big response bodies.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------------------------------------------------------
# Payments (Stripe) + credits.
# Create the recurring price + webhook in Stripe and set these in the env.
# The $ amounts live in Stripe; the credit grants live here.
# ---------------------------------------------------------------------------
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.subscription-price-id=${STRIPE_SUBSCRIPTION_PRICE_ID:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success?order={ORDER_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/billing}
stripe.currency=${STRIPE_CURRENCY:usd}

# Credits granted per successful monthly subscription payment (1 credit ≈ 1 page).
credits.subscription-monthly-grant=${CREDITS_SUBSCRIPTION_MONTHLY_GRANT:150}
# Optional one-time grant when a wallet is first created (useful for testing).
credits.signup-bonus=${CREDITS_SIGNUP_BONUS:0}
