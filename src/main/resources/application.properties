spring.application.name=SaaS

# ---------------------------------------------------------------------------
# Database (PostgreSQL)
# Override with env vars in production; defaults target a local postgres.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebookwriter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# JWT
# jwt.secret MUST be at least 32 chars (256 bits) for HS256. Set a strong,
# random JWT_SECRET in the environment — the default below is for local dev
# only and must not be used in production.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-me-local-dev-secret-please-override-32b}
# Access-token lifetime in ms (default 15 minutes).
jwt.expiration=${JWT_EXPIRATION:900000}
# Access-token lifetime when "remember me" is set, in ms (default 30 days).
jwt.expiration.rememberMe=${JWT_EXPIRATION_REMEMBER_ME:2592000000}

# ---------------------------------------------------------------------------
# Email (Postmark transactional API)
# ---------------------------------------------------------------------------
postmark.api.server-token=${POSTMARK_SERVER_TOKEN:}
# Must be a verified Sender Signature / domain in Postmark or every send fails.
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.mail.app-name=${MAIL_APP_NAME:eBook Writer}

# Base URL of the frontend — used to build the verification / reset links in
# emails (e.g. https://app.example.com/verify?tokenId=...&token=...).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# CORS — comma-separated exact origins (no trailing slash).
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
